    {key:'facility_transfer',test:/\b(facility\s*(to|-)\s*facility|inter\s*facility|\bift\b|routine\s*ift)\b/i},
    {key:'ambulatory',test:/\bambulatory|walking\b/i}
  ];

  function ensureBookSignStyles(){
    if(document.getElementById(BOOK_SIGN_STYLE_ID))return;
    const style=document.createElement('style');
    style.id=BOOK_SIGN_STYLE_ID;
    style.textContent=' .bookRideSign{position:relative;isolation:isolate;display:inline-flex!important;align-items:center;justify-content:center;gap:0;min-height:54px;padding:12px 28px!important;border-radius:20px!important;border:2px solid #cf1f1f!important;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0) 33%),radial-gradient(130% 95% at 50% 0,#9f0f0f 0,#7f0707 52%,#690505 100%)!important;color:#fff!important;text-decoration:none!important;text-transform:uppercase;letter-spacing:.02em;font-family:Manrope,sans-serif!important;font-weight:900!important;line-height:1.05;box-shadow:0 20px 38px rgba(70,0,0,.32),inset 0 1px 0 rgba(255,255,255,.25),inset 0 -7px 14px rgba(18,0,0,.34)!important;overflow:hidden;white-space:nowrap}.bookRideSign:before{content:"";position:absolute;pointer-events:none}.bookRideSign:before{inset:4px;border-radius:16px;border:1px solid rgba(255,74,74,.48)}.bookRideSign span[aria-hidden="true"]{display:none!important}@media(max-width:620px){.bookRideSign{min-height:50px;padding:11px 17px!important;border-radius:16px!important;font-size:13px}}';
    document.head.appendChild(style);
  }

  function isBookCta(el){
    if(!el)return false;
    const text=(el.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();
    const href=(el.getAttribute('href')||'').toLowerCase();
    return text.includes('book a ride') || text.includes('book transportation') || el.classList.contains('bookRideCta') || el.getAttribute('data-book-ride') !== null || href.includes('book=1');
  }

  function normalizeService(value){
    const raw=String(value||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
    if(!raw)return '';
    if(raw==='wheel_chair')return 'wheelchair';
    if(raw==='routine_ift'||raw==='ift_routine'||raw==='interfacility'||raw==='inter_facility')return 'facility_transfer';
    if(raw==='critical_ift'||raw==='high_acuity_ift'||raw==='critical_care_transfer')return 'facility_transfer_critical';
    if(raw==='als_ii'||raw==='als2')return 'als2';
    if(raw==='als_i'||raw==='als1')return 'als1';
    return raw;
  }

  function parseServiceFromText(text){
    for(const rule of KNOWN_SERVICES){
      if(rule.test.test(text)) return rule.key;
    }
    return '';
  }

  function inferServiceFromElement(el){
    if(!el)return '';
    const attrs=[
      el.getAttribute('data-service'),
      el.getAttribute('data-book-service'),
      el.getAttribute('data-transport'),
      el.getAttribute('data-service-type'),
      el.getAttribute('data-ride-type'),
      el.getAttribute('href'),
      el.getAttribute('aria-label'),
      el.getAttribute('title'),
      el.className,
      el.id,
      el.textContent
    ].map(function(v){return String(v||'');}).filter(Boolean);

    for(const candidate of attrs){
      const normalized=normalizeService(candidate);
      if(normalized&&KNOWN_SERVICES.some(function(rule){return rule.key===normalized;}))return normalized;
      const parsed=parseServiceFromText(candidate);
      if(parsed)return parsed;
    }

    const scope=el.closest('[data-service],[data-transport],article,section,.card,.serviceCard,.roleCard,.moduleHero,.heroPanel');
    const scopeText=String(scope&&scope.textContent||'').replace(/\s+/g,' ').slice(0,900);
    return parseServiceFromText(scopeText);
  }

  function buildBookingUrl(el){
    const service=inferServiceFromElement(el);
    if(!service)return '/booking-app.html';
    return '/booking-app.html?service='+encodeURIComponent(service);
  }

  function applyBookRideSign(root){
    (root||document).querySelectorAll('a, button, [role="button"]').forEach(function(el){
      if(isBookCta(el)){
        el.classList.add('bookRideSign');
        if(el.tagName==='A')el.setAttribute('href',buildBookingUrl(el));
      }
    });
  }

  function redirectBookCta(event){
    const el=event.target.closest('a, button, [role="button"]');
    if(!isBookCta(el))return;
    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation();
    window.location.assign(buildBookingUrl(el));
  }

  document.addEventListener('pointerdown', redirectBookCta, true);
  document.addEventListener('mousedown', redirectBookCta, true);
  document.addEventListener('click', redirectBookCta, true);
  document.addEventListener('keydown', function(event){
    if(event.key!=='Enter'&&event.key!==' '){return;}
    const el=event.target.closest('a, button, [role="button"]');
    if(isBookCta(el))redirectBookCta(event);
  }, true);

  ensureBookSignStyles();
  applyBookRideSign(document);

  const observer=new MutationObserver(function(records){
    records.forEach(function(record){
      record.addedNodes.forEach(function(node){
        if(node.nodeType!==1)return;
        if(node.matches&&node.matches('a, button, [role="button"]')&&isBookCta(node))node.classList.add('bookRideSign');
        if(node.querySelectorAll)applyBookRideSign(node);
      });
    });
  });
  observer.observe(document.documentElement,{childList:true,subtree:true});
})();
</script><script>
(function(){
  function normalizeHomepageLanguageSelector(){
    const selectors=document.querySelectorAll('label.headerLanguage, label.nexusLanguageControl.headerLanguageGlobal');
    selectors.forEach(function(label){
      if(!label.querySelector('select[data-nexus-language]')) return;
      label.classList.add('nexusLanguageControl','headerLanguageGlobal');
      if(!label.dataset.nexusLangNormalized){
        label.querySelectorAll('svg').forEach(function(icon){ icon.remove(); });
        const sr=label.querySelector('.srOnly');
        if(sr) sr.classList.add('sr');
        label.dataset.nexusLangNormalized='1';
      }
    });
  }

  function startNormalization(){
    normalizeHomepageLanguageSelector();
    const observer=new MutationObserver(normalizeHomepageLanguageSelector);
    observer.observe(document.documentElement,{childList:true,subtree:true});
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',startNormalization,{once:true});
  }else{
    startNormalization();
  }
})();
</script><script>
(function(){
  const BREAKPOINT=950;

  function parseService(el){
    const label=String(el?.getAttribute('aria-label')||'').toLowerCase();
    if(label.includes('wheelchair')) return 'wheelchair';
    if(label.includes('stretcher')) return 'stretcher';
    if(label.includes('ambulance')) return 'bls';
    if(label.includes('shuttle')) return 'ambulatory';
    return '';
  }

  function bookingUrl(el){
    const service=parseService(el);
    return service?`/booking-app.html?service=${encodeURIComponent(service)}`:'/booking-app.html';
  }

  function showLivecareInMobileMenu(){
    const nav=document.querySelector('#primary-navigation');
    const livecare=document.querySelector('.livecareLink');
    const menuBtn=document.querySelector('.menuBtn');
    if(!nav) return false;
    const servicesLink=nav.querySelector('a[href="#services"]');
    let clone=nav.querySelector('[data-mobile-livecare="1"]');
    const compactNavActive=window.innerWidth<=BREAKPOINT || (menuBtn&&window.getComputedStyle(menuBtn).display!=='none');

    function normalizeMobileLivecare(link){
      if(!link) return;
      link.classList.remove('livecareLink');
      link.style.setProperty('display','block','important');
      link.style.setProperty('visibility','visible','important');
      link.style.setProperty('opacity','1','important');
    }

    if(compactNavActive){
      if(servicesLink){
        servicesLink.style.setProperty('display','none','important');
        servicesLink.setAttribute('aria-hidden','true');
        servicesLink.setAttribute('tabindex','-1');
      }

      if(!clone){
        clone=livecare?livecare.cloneNode(true):document.createElement('a');
        if(!livecare){
          clone.href='/livecare.html';
          clone.textContent='Livecare';
        }
        clone.dataset.mobileLivecare='1';
        normalizeMobileLivecare(clone);
      }

      normalizeMobileLivecare(clone);
      const secondLink=nav.querySelector('a:nth-of-type(2)');
      if(secondLink&&secondLink.parentNode===nav){
        nav.insertBefore(clone, secondLink.nextSibling);
      } else {
        nav.appendChild(clone);
      }
      return true;
    }

    if(clone){
      clone.remove();
    }

    if(servicesLink){
      servicesLink.style.removeProperty('display');
      servicesLink.removeAttribute('aria-hidden');
      servicesLink.removeAttribute('tabindex');
    }

    return true;
  }

  function updateMobileServicesSectionVisibility(){
    const menuBtn=document.querySelector('.menuBtn');
    const compactNavActive=window.innerWidth<=BREAKPOINT || (menuBtn&&window.getComputedStyle(menuBtn).display!=='none');
    const servicesAnchor=document.querySelector('#services');
    const servicesSection=servicesAnchor?(servicesAnchor.closest('section')||servicesAnchor):null;

    if(!servicesSection) return true;

    if(compactNavActive){
      servicesSection.style.setProperty('display','none','important');
      servicesSection.setAttribute('aria-hidden','true');
      servicesSection.setAttribute('data-mobile-services-hidden','1');
      return true;
    }

    servicesSection.style.removeProperty('display');
    servicesSection.removeAttribute('aria-hidden');
    servicesSection.removeAttribute('data-mobile-services-hidden');
    return true;
  }

  function updateMobileSectionPruning(){
    const menuBtn=document.querySelector('.menuBtn');
    const compactNavActive=window.innerWidth<=BREAKPOINT || (menuBtn&&window.getComputedStyle(menuBtn).display!=='none');
    const pruneHeadingPatterns=[
      /the right level of care for every journey\.?/i,
      /confidence before, during and after the ride\.?/i,
      /designed for teams that coordinate care\.?/i,
      /operational accountability made visible\.?/i
    ];

    const sections=[...document.querySelectorAll('main section')];
    sections.forEach((section)=>{
      const heading=section.querySelector('h2, h3');
      const text=String(heading&&heading.textContent||'').trim();
      const shouldPrune=pruneHeadingPatterns.some((pattern)=>pattern.test(text));

      if(!shouldPrune) return;

      if(compactNavActive){
        section.style.setProperty('display','none','important');
        section.setAttribute('aria-hidden','true');
        section.setAttribute('data-mobile-pruned','1');
        return;
      }

      section.style.removeProperty('display');
      section.removeAttribute('aria-hidden');
      section.removeAttribute('data-mobile-pruned');
    });

    return true;
  }

  function bindMobileMenuToggle(){
    const btn=document.querySelector('.menuBtn');
    const nav=document.querySelector('#primary-navigation');
    if(!btn||!nav) return false;
    if(btn.dataset.mobileToggleBound==='1') return true;
    btn.dataset.mobileToggleBound='1';

    const syncExpanded=()=>{
      const open=nav.classList.contains('open');
      btn.setAttribute('aria-expanded',String(open));
      btn.setAttribute('aria-label',open?'Close navigation menu':'Open navigation menu');
    };

    btn.addEventListener('click',function(event){
      event.preventDefault();
      event.stopPropagation();
      const shouldOpen=btn.getAttribute('aria-expanded')!=='true';

      // Apply at end of click cycle so this state is not immediately overwritten.
      window.setTimeout(function(){
        nav.classList.toggle('open',shouldOpen);
        syncExpanded();
      },0);
    },true);

    nav.addEventListener('click',function(event){
      const link=event.target.closest('a');
      if(!link||window.innerWidth>BREAKPOINT) return;
      nav.classList.remove('open');
      syncExpanded();
    });

    syncExpanded();
    return true;
  }

  function routeJourneyCard(event){
    const card=event.target.closest('button[aria-label^="Request "]');
    if(!card) return;
    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation();
    window.location.assign(bookingUrl(card));
  }

  function routeTripLocationButton(event){
    const button=event.target.closest('button');
    if(!button) return;
    const label=String(button.getAttribute('aria-label')||button.textContent||'').replace(/\s+/g,' ').trim();
    if(!/^check a trip location$/i.test(label)) return;
    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation();
    window.location.assign('/livecare.html');
  }

  document.addEventListener('pointerdown', routeJourneyCard, true);
  document.addEventListener('mousedown', routeJourneyCard, true);
  document.addEventListener('click', routeJourneyCard, true);
  document.addEventListener('pointerdown', routeTripLocationButton, true);
  document.addEventListener('mousedown', routeTripLocationButton, true);
  document.addEventListener('click', routeTripLocationButton, true);
  document.addEventListener('keydown', function(event){
    if(event.key!=='Enter'&&event.key!==' ') return;
    routeJourneyCard(event);
    routeTripLocationButton(event);
  }, true);

  let mobileSyncAttempts=0;
  const sync=()=>{
    const livecareReady=showLivecareInMobileMenu();
    const toggleReady=bindMobileMenuToggle();
    const servicesReady=updateMobileServicesSectionVisibility();
    const sectionsReady=updateMobileSectionPruning();
    if(!(livecareReady&&toggleReady&&servicesReady&&sectionsReady)&&mobileSyncAttempts<20){
      mobileSyncAttempts+=1;
      window.setTimeout(sync,100);
    }
  };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', sync, { once:true }); else sync();
  window.addEventListener('load', sync);
  window.addEventListener('resize', sync);
})();
</script>

<script>(function(){function popLogos(){document.querySelectorAll('img.logo, img[src*="nexus-logo"], img[src*="logo.png"], header img[alt*="Nexus"]').forEach(function(el){el.classList.remove('logo-pop');void el.offsetWidth;el.classList.add('logo-pop');el.addEventListener('animationend',function(){el.classList.remove('logo-pop');},{once:true});});}function init(){popLogos();setInterval(popLogos,60000);}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){setTimeout(init,500);},{once:true});}else{setTimeout(init,500);}var obs=new MutationObserver(function(muts){muts.forEach(function(m){m.addedNodes.forEach(function(n){if(n.nodeType===1){var imgs=n.tagName==='IMG'?[n]:Array.from(n.querySelectorAll('img'));imgs.forEach(function(img){if(img.src&&(img.src.includes('logo')||img.alt&&img.alt.toLowerCase().includes('nexus'))){img.classList.remove('logo-pop');void img.offsetWidth;img.classList.add('logo-pop');img.addEventListener('animationend',function(){img.classList.remove('logo-pop');},{once:true});}});}});});});obs.observe(document.body,{childList:true,subtree:true});}());</script>
