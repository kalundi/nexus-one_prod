<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Book A Ride Sign</title>
  <desc id="desc">Red rounded sign with Book A Ride and N MTO text.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ab0f12"/>
      <stop offset="52%" stop-color="#87090b"/>
      <stop offset="100%" stop-color="#690507"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#230001" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="26" y="26" width="1348" height="748" rx="92" fill="url(#base)" stroke="#520203" stroke-width="10" filter="url(#shadow)"/>
  <rect x="40" y="40" width="1320" height="720" rx="82" fill="none" stroke="#d92a2e" stroke-width="4"/>
  <rect x="72" y="72" width="1256" height="230" rx="115" fill="url(#gloss)"/>

  <text x="700" y="430" text-anchor="middle" fill="#ffffff" font-size="245" font-family="Manrope, Arial, sans-serif" font-weight="800" letter-spacing="2">Book A Ride</text>

  <line x1="190" y1="570" x2="530" y2="570" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <text x="700" y="595" text-anchor="middle" fill="#ffffff" font-size="76" font-family="Manrope, Arial, sans-serif" font-weight="700" letter-spacing="20">N MTO</text>
  <line x1="870" y1="570" x2="1210" y2="570" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
</svg>
