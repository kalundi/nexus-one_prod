[build]
  command = "npm run db:migrate || echo 'Migration skipped'; npm run admin:create-test || echo 'Admin init skipped'; npm run test:create-users || echo 'Test users skipped'; npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20.20.2"
  NPM_VERSION = "10.9.2"
  NPM_FLAGS = "--registry=https://registry.npmjs.org/"
  SECRETS_SCAN_SMART_DETECTION_OMIT_KEYS = "DATABASE_URL"
  NEXUS_ADMIN_EMAIL = "admin@nexusmt.com"
  NEXUS_ADMIN_PASSWORD = "NexusAdmin042!"
  # TEAMS_WEBHOOK_URL = set in Netlify dashboard env vars (not here — keep secret)
  # To configure Teams: Admin_NMT channel → (...) → Connectors → Incoming Webhook → copy URL → add as TEAMS_WEBHOOK_URL in Netlify site settings

# Scheduled function: send ride reminders 1 hour before trip
[functions.ride-reminders]
  schedule = "*/15 * * * *"

# Scheduled function: refresh fuel index weekly (Monday 6:00 AM UTC)
[functions.fuel-index-refresh]
  schedule = "0 6 * * 1"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Exclude dist files from SPA redirect
[[redirects]]
  from = "/dist/*"
  to = "/dist/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # Content Security Policy - prevents unauthorized script execution
    Content-Security-Policy = "script-src 'self' 'unsafe-inline' https://maps.googleapis.com https://maps.gstatic.com https://cdn.ywxi.net; img-src 'self' https://maps.googleapis.com https://maps.gstatic.com https://tile.openstreetmap.org data: https://cdn.ywxi.net https://example.com https://existing-url.com https://new-allowed-domain.com; connect-src 'self' https://maps.googleapis.com https://s3-us-west-2.amazonaws.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src https://www.google.com"
    # Prevent clickjacking attacks
    X-Frame-Options = "DENY"
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    # Enable XSS protection in older browsers
    X-XSS-Protection = "1; mode=block"
    # Referrer policy - limit referrer information sent to external sites
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permissions policy - disable features that could be abused
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    # HSTS - enforce HTTPS for future connections
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
