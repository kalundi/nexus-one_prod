name: Patient app regression
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'patient*.html'
      - 'patient*.js'
      - 'patient*.css'
      - 'build6-patient.js'
      - 'booking-app.html'
      - 'booking-app.js'
      - 'tests/patient-app-journey.spec.js'
      - 'playwright.config.js'
      - 'scripts/local-test-server.cjs'
      - '.github/workflows/patient-member.yml'
permissions:
  contents: read
jobs:
  runner-smoke:
    name: Runner health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm runner and storage
        run: |
          uname -a
          date -u
          df -h .
          echo 'Runner initialized' >> "$GITHUB_STEP_SUMMARY"
  patient-journey:
    name: Patient browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check runtime
        run: |
          node --version
          npm --version
          test -f package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript and inline scripts
        run: |
          node --check patient-app.js
          node --check patient-service.js
          node --check build6-patient.js
          node --check tests/patient-app-journey.spec.js
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          const html=fs.readFileSync('patient.html','utf8');
          for(const match of html.matchAll(/<script>([\s\S]*?)<\/script>/gi)) new vm.Script(match[1]);
          NODE
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify browser launch
        run: node -e "const {chromium}=require('playwright'); (async()=>{const b=await chromium.launch(); await b.close();})().catch(e=>{console.error(e);process.exit(1)})"
      - name: Verify isolated local test server
        run: |
          node scripts/local-test-server.cjs > patient-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/health
          curl --fail --silent http://127.0.0.1:4173/patient.html > /dev/null
      - name: Run patient app journey regression
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output
          npx playwright test tests/patient-app-journey.spec.js --workers=1 --reporter=list,html --trace=retain-on-failure 2>&1 | tee patient-regression.log
      - name: Record outcome
        if: always()
        run: |
          echo '### Patient regression' >> "$GITHUB_STEP_SUMMARY"
          echo 'Job status: ${{ job.status }}' >> "$GITHUB_STEP_SUMMARY"
          if test -f patient-regression.log; then
            echo 'See uploaded artifacts for the test output and browser traces.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Browser test output absent; inspect preceding setup steps.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patient-regression-results
          path: |
            patient-server.log
            patient-regression.log
            playwright-report/
            test-results/
            output/patient-app-*.png
          if-no-files-found: warn
          retention-days: 7
