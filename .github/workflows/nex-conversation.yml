name: Nex conversational integration
on:
  workflow_dispatch:
  push:
    branches: [main, feature/nex-approved-knowledge-integration]
  pull_request:
    paths:
      - 'ask-nex.html'
      - 'visitor-assistant.js'
      - 'netlify/functions/_shared/visitor-*.cjs'
      - 'netlify/functions/_shared/nex-*'
      - 'netlify/functions/nex-insights.cjs'
      - 'netlify/functions/visitor-assistant.cjs'
      - 'nex-insights.html'
      - 'auth-guard.js'
      - 'nex-insights.js'
      - 'nex-knowledge-editor.js'
      - 'netlify/functions/nex-knowledge-drafts.cjs'
      - 'netlify/functions/_shared/nex-knowledge-drafts.cjs'
      - 'database/migrations/*nex*'
      - 'admin-apps.js'
      - 'tests/nex-approved-knowledge.test.cjs'
      - 'tests/nex-social-content.test.cjs'
      - 'tests/nex-intent-insights.test.cjs'
      - 'tests/nex-ai-suggestions.test.cjs'
      - 'tests/nex-insights-chat.test.cjs'
      - 'tests/nex-insight-reviews.test.cjs'
      - 'tests/nex-knowledge-drafts.test.cjs'
      - 'netlify/functions/_shared/staff-assistant.cjs'
      - 'tests/nex-dashboard-auth.test.cjs'
      - 'tests/nex-conversation.spec.cjs'
      - 'tests/nex-booking-intent-grounding.test.cjs'
      - 'tests/nex-authenticated-public-fallback.test.cjs'
      - 'tests/nex-click-outside-preserve-session.test.cjs'
      - 'tests/nex-staff-estimate-routing.test.cjs'
      - 'tests/nex-public-role-inheritance.test.cjs'
      - 'tests/nex-link-punctuation.test.cjs'
      - 'tests/nex-admin.spec.cjs'
      - 'tests/nex-authorization-contract.test.cjs'
      - 'tests/visitor-assistant.test.cjs'
      - 'playwright.nex.config.cjs'
      - 'scripts/nex-playwright-server.cjs'
      - '.github/workflows/nex-conversation.yml'
permissions:
  contents: read
jobs:
  runner-smoke:
    name: GitHub runner smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm runner starts
        run: |
          echo 'Nex GitHub Actions runner started'
          uname -a
          date -u
  unit:
    name: Nex unit / syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source syntax
        run: |
          node --version
          node --check netlify/functions/_shared/visitor-assistant-core.cjs
          node --check netlify/functions/_shared/nex-intent-insights.cjs
          node --check netlify/functions/_shared/nex-ai-suggestions.cjs
          node --check netlify/functions/_shared/nex-insights-chat.cjs
          node --check netlify/functions/_shared/nex-public-role-intent.cjs
          node --check netlify/functions/_shared/nex-insight-reviews.cjs
          node --check netlify/functions/_shared/nex-knowledge-drafts.cjs
          node --check netlify/functions/_shared/nex-social-content.cjs
          node --check visitor-assistant.js
          node --check netlify/functions/nex-knowledge-drafts.cjs
          node --check nex-knowledge-editor.js
          node --check netlify/functions/nex-insights.cjs
          node --check nex-insights.js
          node --check netlify/functions/_shared/nex-reviewed-knowledge.cjs
          node --check tests/nex-approved-knowledge.test.cjs
          node --check tests/nex-admin.spec.cjs
          node --check scripts/nex-playwright-server.cjs
      - name: Check Ask Nex page JavaScript
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          const html=fs.readFileSync('ask-nex.html','utf8');
          const script=html.match(/<script>([\s\S]*?)<\/script>/i);
          if(!script) throw Error('Missing Ask Nex script');
          new vm.Script(script[1],{filename:'ask-nex.html'});
          console.log('Ask Nex script syntax OK');
          NODE
      - name: Test reviewed website knowledge and natural conversation
        run: node --test --test-reporter=spec tests/nex-approved-knowledge.test.cjs
      - name: Test curated Nex booking and social links
        run: node --test --test-reporter=spec tests/nex-social-content.test.cjs
      - name: Test private Nex intent analytics
        run: node --test --test-reporter=spec tests/nex-intent-insights.test.cjs
      - name: Test AI insight safeguards
        run: node --test --test-reporter=spec tests/nex-ai-suggestions.test.cjs
      - name: Test Nex dashboard auth and blank-page regression
        run: node --test --test-reporter=spec tests/nex-dashboard-auth.test.cjs
      - name: Test Nex knowledge approval staging and export
        run: node --test --test-reporter=spec tests/nex-knowledge-drafts.test.cjs
      - name: Test Nex recommendation review queue
        run: node --test --test-reporter=spec tests/nex-insight-reviews.test.cjs
      - name: Test Nex admin authorization and confirmation invariants
        run: node --test --test-reporter=spec tests/nex-authorization-contract.test.cjs
      - name: Test authenticated Nex Insights chat routing
        run: node --test --test-reporter=spec tests/nex-insights-chat.test.cjs
      - name: Test Nex Directions retry and estimate errors
        run: node --test --test-reporter=spec tests/nex-estimate-directions.test.cjs
      - name: Test Nex link punctuation in estimate answers
        run: node --test --test-reporter=spec tests/nex-link-punctuation.test.cjs
      - name: Test Nex public content and role permissions
        run: node --test --test-reporter=spec tests/nex-public-role-inheritance.test.cjs
      - name: Test Nex estimate for signed-in staff
        run: node --test --test-reporter=spec tests/nex-staff-estimate-routing.test.cjs
      - name: Test Nex outside click session preservation
        run: node --test --test-reporter=spec tests/nex-click-outside-preserve-session.test.cjs
      - name: Test authenticated public Nex FAQ and booking video fallback
        run: node --test --test-reporter=spec tests/nex-authenticated-public-fallback.test.cjs
      - name: Test grounded booking process answers and video selection
        run: node --test --test-reporter=spec tests/nex-booking-intent-grounding.test.cjs
      - name: Test existing Nex assistant behavior
        run: node --test --test-reporter=spec tests/visitor-assistant.test.cjs
  browser:
    name: Playwright ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium-desktop, mobile-webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser and OS dependencies
        run: |
          if [ "${{ matrix.browser }}" = "mobile-webkit" ]; then
            npx playwright install --with-deps webkit
          else
            npx playwright install --with-deps chromium
          fi
      - name: Run browser tests
        run: npx playwright test --config playwright.nex.config.cjs --project "${{ matrix.browser }}" --workers=1
      - name: Save Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nex-playwright-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
