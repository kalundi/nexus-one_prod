name: Nex conversational integration
on:
  push:
    branches: [feature/nex-approved-knowledge-integration]
  pull_request:
    paths:
      - 'ask-nex.html'
      - 'netlify/functions/_shared/visitor-*.cjs'
      - 'netlify/functions/_shared/nex-*'
      - 'tests/nex-approved-knowledge.test.cjs'
      - 'tests/nex-conversation.spec.cjs'
      - 'tests/visitor-assistant.test.cjs'
      - 'playwright.nex.config.cjs'
      - 'scripts/nex-playwright-server.cjs'
      - '.github/workflows/nex-conversation.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate page script syntax
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          const html=fs.readFileSync('ask-nex.html','utf8');
          const script=html.match(/<script>([\s\S]*?)<\/script>/i);
          if(!script) throw Error('Missing Ask Nex script');
          new vm.Script(script[1]);
          NODE
      - name: Nex knowledge and conversation unit tests
        run: |
          node --test tests/nex-approved-knowledge.test.cjs
          node --test tests/visitor-assistant.test.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Desktop and mobile Nex Playwright tests
        run: npx playwright test --config playwright.nex.config.cjs
      - name: Upload failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nex-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
