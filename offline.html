<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08233a">
  <meta name="robots" content="noindex,nofollow">
  <title>Temporarily unavailable | Nexus Medical Transit</title>
  <style>
    :root{color-scheme:light;font-family:Arial,Helvetica,sans-serif;background:#f2f6f9;color:#10243a}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,620px);background:#fff;border:1px solid #d8e2eb;border-radius:22px;padding:clamp(28px,6vw,56px);box-shadow:0 18px 55px #10243a18;text-align:center}
    .brand{display:inline-flex;align-items:center;gap:10px;color:#087f8c;font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
    .mark{width:38px;height:38px;border-radius:12px;background:#087f8c;color:white;display:grid;place-items:center;font-size:20px}
    h1{font-size:clamp(28px,6vw,40px);line-height:1.12;margin:28px 0 14px;color:#0b2035}
    p{font-size:17px;line-height:1.6;color:#526579;margin:0 auto 24px;max-width:480px}
    .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:28px 0}
    a,button{min-height:48px;border-radius:10px;padding:13px 18px;font:700 15px Arial,Helvetica,sans-serif;text-decoration:none;cursor:pointer}
    .primary{background:#087f8c;color:#fff;border:1px solid #087f8c}.secondary{background:#fff;color:#17334b;border:1px solid #cbd8e2}
    .contact{border-top:1px solid #e3eaf0;margin-top:30px;padding-top:22px;font-size:14px;color:#526579}
    .contact a{padding:0;min-height:0;color:#087f8c;font:700 15px Arial,Helvetica,sans-serif}
    :focus-visible{outline:3px solid #e9a82a;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true">N</span> Nexus Medical Transit</div>
    <h1>We’re temporarily unavailable</h1>
    <p>We’re having trouble loading our website right now. Please try again in a moment. If you need help with a ride, our team is here by phone.</p>
    <div class="actions">
      <button class="primary" type="button" onclick="window.location.reload()">Try again</button>
      <a class="secondary" href="tel:+18886395766">Call (888) 639-5766</a>
    </div>
    <div class="contact">Ambulance Services: <a href="tel:+18887604990">(888) 760-4990</a><br>For email support: <a href="mailto:contact@nexusmt.com">contact@nexusmt.com</a></div>
  </main>
</body>
</html>
